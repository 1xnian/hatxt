name: Build HA Android dynamic address APK

# Builds the minimal release APK (R8 code shrinking enabled), runs the unit tests of the dynamic
# (TXT/SRV) endpoint resolver, verifies the produced APK, and publishes the signed APK to GitHub
# Releases (prerelease) with a human-readable changelog.
#
# Why this workflow exists in this shape:
#   * The previous revision passed -PnoLeakCanary=true while the committed dependency lock state had
#     been resolved *with* LeakCanary. The configuration and the lock state disagreed, so every
#     locked build failed with
#       org.gradle.internal.locking.LockOutOfDateException: Did not resolve
#       'com.squareup.leakcanary:shark:2.14' which is part of the dependency lock state
#     The dependency declaration was removed instead (see gradle.properties), so the resolved graph
#     and the lock files agree by construction and the flag is no longer needed or passed.
#   * The debug APK used to carry a second launcher entry called "Leaks" that came from the
#     LeakCanary debug dependency. Removing the declaration removes that entry; the inspection step
#     fails the job if it ever comes back.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: dynamic-address-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and inspect Minimal Release APK (R8)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Monotonic, per-run version code so each test APK is uniquely identifiable
      # (shown as the "(code)" part of the version in the about screen / app-info).
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compute build timestamp (Beijing time)
        id: ts
        shell: bash
        run: |
          set -euo pipefail
          # Used both as the "beta" suffix in the APK version name and as the Release tag.
          # Beijing time (UTC+8) so the stamp matches the user's local clock.
          TS="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "tag=beta$TS" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 'basic' uses the MIT licensed GitHub Actions cache instead of the proprietary one.
          cache-provider: basic

      - name: Verify the Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          # The wrapper must keep its executable bit in git (mode 100755). Fixing the mode here is a
          # safety net for checkouts that lost it; the authoritative fix lives in the repository.
          if [ ! -x gradlew ]; then
            echo "::warning::gradlew lost its executable bit in this checkout, restoring it."
            chmod +x gradlew
          fi
          ./gradlew --version

      - name: Install the Android SDK packages required by compileSdk 37
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" \
              -maxdepth 3 -type f -name sdkmanager | head -n1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Provide mocked Google Services configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .github/mock-google-services.json app/google-services.json
          cp .github/mock-google-services.json wear/google-services.json
          cp .github/mock-google-services.json automotive/google-services.json

      - name: Verify the committed dependency lock state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          # Dependency locking is enabled project wide. A module that is listed in gradle.lockfile
          # but is no longer part of the declared graph is injected back by the lock state, cannot be
          # resolved, and shows up as `<module> FAILED` in this report; a real resolution of the same
          # configuration then aborts with
          #   LockOutOfDateException: Did not resolve '<module>' which is part of the dependency lock
          #   state
          # The dump is produced by the lenient report on purpose: resolving `:app`'s flavoured
          # classpaths from a standalone task fails on project variant selection
          # (ArtifactSelectionException on :common, which has no matching product flavour), which
          # would hide the lock violation behind an unrelated error. The authoritative resolution
          # happens in the assemble step below.
          ./gradlew :app:dependencies --configuration minimalDebugRuntimeClasspath \
            > diagnostics/dependencies-minimalDebug.txt

          stale="$(grep -c ' FAILED$' diagnostics/dependencies-minimalDebug.txt || true)"
          leakcanary="$(grep -ci leakcanary diagnostics/dependencies-minimalDebug.txt || true)"
          {
            echo "unresolved entries in minimalDebugRuntimeClasspath (expected 0): $stale"
            echo "LeakCanary entries in minimalDebugRuntimeClasspath (expected 0): $leakcanary"
          } | tee diagnostics/lock-state.txt

          if [ "$stale" -ne 0 ]; then
            echo "::error::The dependency lock state no longer matches the declared graph."
            grep ' FAILED$' diagnostics/dependencies-minimalDebug.txt
            echo "Re-resolve with --write-locks; do not edit or delete gradle.lockfile by hand."
            exit 1
          fi
          if [ "$leakcanary" -ne 0 ]; then
            echo "::error::LeakCanary is still on the minimal debug runtime classpath."
            exit 1
          fi

      - name: Run unit tests of the endpoint resolver
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :common:testDebugUnitTest --stacktrace

      - name: Run the remaining unit tests (informational)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew :app:testMinimalDebugUnitTest --stacktrace

      - name: Build Minimal Release APK (R8 enabled)
        env:
          BUILD_TIMESTAMP: ${{ steps.ts.outputs.ts }}
        shell: bash
        run: |
          set -euo pipefail
          # arm64-only via ndk.abiFilters in defaultConfig. R8 shrinks the DEX (see the release
          # build type in app/build.gradle.kts) and StrictMode FailFast stays enabled so any
          # main-thread I/O regression introduced by app code is still caught on device.
          # Signing uses the committed test keystore (app/keystore/ha-test.keystore) by default, so
          # every build shares one signature and testers can update over the existing install.
          # BUILD_TIMESTAMP (Beijing time) becomes the "beta<ts>" suffix of the APK version name.
          ./gradlew :app:assembleMinimalRelease --stacktrace

      - name: Static APK inspection
        if: always()
        shell: bash
        run: bash .github/scripts/apk-static-inspection.sh

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-assistant-dynamic-address-minimal-release-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload static inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-static-inspection-report
          path: |
            diagnostics/apk-static-inspection-report.md
            diagnostics/merged-manifest.txt
            diagnostics/dependencies-minimalDebug.txt
            diagnostics/lock-state.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            common/build/reports/tests/**
            common/build/test-results/**
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/reports/**
            */build/reports/**
          if-no-files-found: warn
          retention-days: 7

      - name: Read APK version for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          APK_META="app/build/outputs/apk/minimal/release/output-metadata.json"
          VER="$(python3 -c "import json;d=json.load(open('$APK_META'));print(d['elements'][0]['versionName'])")"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ts.outputs.tag }}
          name: HA Android 测试版 ${{ steps.ts.outputs.tag }}
          body: |
            ## Home Assistant Android 测试版（R8 压缩）

            基于 Home Assistant Android 官方代码构建的测试版 APK。

            **版本**：${{ steps.notes.outputs.version }}
            **构建来源**：commit `${{ github.sha }}` — [查看 CI 运行](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### 本版特性
            - R8 代码压缩已开启，APK 体积约 18 MB
            - 仅包含 arm64-v8a 架构（适配主流手机）
            - 使用固定测试签名，**可直接覆盖安装**，无需先卸载
            - StrictMode 闪退已修复（仅当违规来自 App 自身代码时才拦截）

            ### 安装说明
            1. 下载下方 `app-minimal-release.apk`
            2. 手机允许「未知来源」安装
            3. 同签名可直接覆盖旧版；若提示签名冲突，先卸载旧版再装

            > ⚠️ 非官方构建，仅用于测试。
          files: |
            app/build/outputs/apk/**/*.apk
          prerelease: true
          make_latest: false
