name: Build HA Android TXT APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: txt-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and inspect Minimal Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Google Services config
        run: cp .github/mock-google-services.json app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Minimal Debug APK
        run: ./gradlew -PnoLeakCanary=true :app:assembleMinimalDebug --no-daemon --stacktrace

      - name: Static APK inspection
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics
          report="diagnostics/apk-inspection.txt"
          {
            echo "Home Assistant Android TXT APK static inspection"
            echo "Generated: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Commit: ${GITHUB_SHA:-unknown}"
            echo
            echo "== Build output files =="
            find app/build/outputs/apk -maxdepth 8 -type f -printf '%p (%s bytes)\n' 2>/dev/null || true
            echo
            echo "== Source manifest launcher declarations =="
            grep -RIn --include='AndroidManifest.xml' -E 'android.intent.action.MAIN|android.intent.category.LAUNCHER|android.intent.category.LEANBACK_LAUNCHER|Leaks|leakcanary' app/src 2>/dev/null || true
            echo
            echo "== LeakCanary build configuration =="
            grep -n -E 'noLeakCanary|leakcanary' gradle.properties build-logic/convention/src/main/kotlin/AndroidCommonConventionPlugin.kt gradle/libs.versions.toml 2>/dev/null || true
            echo
            echo "== TXT resolver source files =="
            find app/src -type f '(' -name '*Txt*' -o -name '*ManualServer*' ')' -print 2>/dev/null || true
          } > "$report"

          apk="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$apk" ]; then
            echo "No APK found. The build may have failed before producing an APK." >> "$report"
            exit 0
          fi

          {
            echo
            echo "== Selected APK =="
            echo "$apk"
            echo "SHA-256: $(sha256sum "$apk" | awk '{print $1}')"
            echo
            echo "== APK badging (package, label, launchable activity) =="
          } >> "$report"

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt=""
          if [ -n "$sdk" ] && [ -d "$sdk/build-tools" ]; then
            aapt="$(find "$sdk/build-tools" -type f -name aapt -print 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -n "$aapt" ]; then
            "$aapt" dump badging "$apk" >> "$report" 2>&1 || true
            {
              echo
              echo "== Merged binary AndroidManifest.xml (activity and intent filters) =="
            } >> "$report"
            "$aapt" dump xmltree "$apk" AndroidManifest.xml 2>&1 | grep -E -A 5 -B 3 'E: application|E: activity|E: activity-alias|E: intent-filter|android.intent.action.MAIN|android.intent.category.LAUNCHER|android.intent.category.LEANBACK_LAUNCHER|Leaks|leakcanary|android:label|android:name' >> "$report" || true
          else
            echo "aapt was not found under Android SDK build-tools; package/manifest dump unavailable." >> "$report"
          fi

          {
            echo
            echo "== APK archive entries related to LeakCanary =="
            unzip -l "$apk" 2>/dev/null | grep -i -E 'leakcanary|leak_activity|leakactivity' || echo "No matching archive entry names (DEX class references require deeper inspection)."
            echo
            echo "== APK archive entries related to manifest and dex =="
            unzip -l "$apk" 2>/dev/null | grep -E 'AndroidManifest.xml|classes[0-9]*\.dex|resources.arsc' || true
          } >> "$report"

          cat "$report"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: home-assistant-txt-minimal-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload static inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-assistant-txt-apk-diagnostics
          path: diagnostics/apk-inspection.txt
          if-no-files-found: warn
          retention-days: 14
